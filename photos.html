<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>КБ911 — Реализовано</title>
<link href="https://fonts.cdnfonts.com/css/d-din" rel="stylesheet">
<style>
@font-face{font-family:"Bahnschrift Local";src:local("Bahnschrift");font-style:normal;font-weight:100 900}
:root{--ink:#111;--paper:#fff;--bg:#f2f2f0;--corner-w:clamp(104px,6.6vw,138px);--corner-h:max(24px,3.1vh)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"D-DIN","Bahnschrift Local","Bahnschrift","Arial Narrow",Arial,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.sheet{position:relative;width:calc(100vw - 24px);height:calc(100vh - 24px);min-height:690px;background:var(--paper);overflow:hidden}

.gallery-shell{position:absolute;left:1.35vw;top:1.35vh;right:.55vw;bottom:1.35vh}
.gallery-frame{position:absolute;inset:0;border:1px solid var(--ink);background:#fff}

.gallery-stage{
  position:absolute;
  left:clamp(24px,2.2vw,46px);
  top:clamp(42px,5.2vh,74px);
  right:clamp(24px,2.2vw,46px);
  bottom:clamp(46px,5.8vh,82px);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden
}
.gallery-image{display:block;flex:0 0 auto;background-repeat:no-repeat;background-position:0 0;opacity:0;transition:opacity .25s ease}
.gallery-image.show{opacity:1}
.empty-state{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(16px,1.05vw,24px);font-style:italic;color:#777}
.gallery-nav{position:absolute;inset:0;pointer-events:none}
.gallery-arrow{
  pointer-events:auto;
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:clamp(38px,3.4vw,64px);
  height:clamp(64px,9vh,112px);
  border:0;
  background:transparent;
  color:var(--ink);
  font:inherit;
  font-size:clamp(30px,2.3vw,52px);
  line-height:1;
  cursor:pointer;
  opacity:.58;
  transition:opacity .18s ease,background .18s ease
}
.gallery-arrow:hover{opacity:1;background:rgba(0,0,0,.035)}
.gallery-arrow.prev{left:0}
.gallery-arrow.next{right:0}
.gallery-arrow:disabled{opacity:.16;cursor:default;background:transparent}

.gallery-meta{
  position:absolute;
  left:50%;
  bottom:1.65vh;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:.8vw;
  white-space:nowrap;
  font-size:clamp(11px,.72vw,16px);
  font-style:italic
}
.gallery-title:empty{display:none}
.gallery-counter{letter-spacing:.08em}

/* Четыре одинаковые узкие рамки */
.corner{
  position:absolute;
  width:var(--corner-w);
  height:var(--corner-h);
  z-index:5;
  background:#fff;
  border:1px solid var(--ink)
}
.corner.tl{left:1.35vw;top:1.35vh}
.corner.tr{right:.55vw;top:1.35vh}
.corner.bl{left:1.35vw;bottom:1.35vh}
.corner.br{right:.55vw;bottom:1.35vh}

.corner-content{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 .45vw;
  white-space:nowrap;
  overflow:hidden;
  color:var(--ink);
  text-decoration:none;
  font:italic 400 clamp(12px,.78vw,17px)/1 "D-DIN","Bahnschrift Local","Bahnschrift","Arial Narrow",Arial,sans-serif;
  letter-spacing:.01em
}
a.corner-content:hover{background:#111;color:#fff}

/* Маски разрывают общую рамку ровно под угловыми блоками */
.corner-mask{position:absolute;width:calc(var(--corner-w) + 2px);height:calc(var(--corner-h) + 2px);background:#fff;z-index:3;pointer-events:none}
.corner-mask.tl{left:-1px;top:-1px}
.corner-mask.tr{right:-1px;top:-1px}
.corner-mask.bl{left:-1px;bottom:-1px}
.corner-mask.br{right:-1px;bottom:-1px}

@media(max-width:760px){
  :root{--corner-w:104px;--corner-h:22px}
  body{padding:0;background:#fff;align-items:stretch;height:100dvh;min-height:0;overflow:hidden}
  .sheet{width:100%;height:100dvh;min-height:0}
  .gallery-shell{left:12px;top:12px;right:8px;bottom:12px}
  .gallery-stage{left:14px;right:14px;top:44px;bottom:44px}
  .gallery-arrow{width:34px;height:62px;font-size:30px}
  .gallery-meta{bottom:28px;font-size:9px}
  .corner.tl,.corner.bl{left:12px}
  .corner.tr,.corner.br{right:8px}
  .corner.tl,.corner.tr{top:12px}
  .corner.bl,.corner.br{bottom:12px}
  .corner-content{padding:0 6px;font-family:"Bahnschrift Local","Bahnschrift SemiCondensed","Arial Narrow",Arial,sans-serif;font-size:9.5px}
}
</style>
</head>
<body>
<main class="sheet">
  <section class="gallery-shell">
    <div class="gallery-frame"></div>
    <div class="corner-mask tl"></div>
    <div class="corner-mask tr"></div>
    <div class="corner-mask bl"></div>
    <div class="corner-mask br"></div>

    <div class="gallery-stage">
      <div class="gallery-image" id="galleryImage" role="img" aria-label="Реализованный проект"></div>
      <div class="empty-state" id="emptyState">Здесь будут реализованные проекты</div>
    </div>

    <div class="gallery-nav">
      <button class="gallery-arrow prev" id="prevBtn" aria-label="Предыдущая фотография">‹</button>
      <button class="gallery-arrow next" id="nextBtn" aria-label="Следующая фотография">›</button>
    </div>

    <div class="gallery-meta">
      <span class="gallery-title" id="galleryTitle"></span>
      <span class="gallery-counter" id="galleryCounter">00 / 00</span>
    </div>
  </section>

  <section class="corner tl">
    <div class="corner-content">04 Реализовано</div>
  </section>

  <section class="corner tr">
    <a class="corner-content" href="index.html">www.kb911.ru</a>
  </section>

  <section class="corner bl">
    <a class="corner-content" href="drawings.html">02 Чертежи</a>
  </section>

  <section class="corner br">
    <a class="corner-content" href="3d-models.html">03 3D-модели</a>
  </section>
</main>

<script>
(function(){
  const spriteWidth = 4363;
  const spriteHeight = 280;
  const photos = [
    {x:0,w:210},{x:210,w:210},{x:420,w:210},{x:630,w:210},{x:840,w:210},
    {x:1050,w:210},{x:1260,w:210},{x:1470,w:210},{x:1680,w:210},{x:1890,w:210},
    {x:2100,w:210},{x:2310,w:210},{x:2520,w:210},{x:2730,w:210},{x:2940,w:210},
    {x:3150,w:210},{x:3360,w:373},{x:3733,w:210},{x:3943,w:210},{x:4153,w:210}
  ];

  const stage = document.querySelector(".gallery-stage");
  const image = document.getElementById("galleryImage");
  const empty = document.getElementById("emptyState");
  const title = document.getElementById("galleryTitle");
  const counter = document.getElementById("galleryCounter");
  const prev = document.getElementById("prevBtn");
  const next = document.getElementById("nextBtn");

  let index = 0;
  let touchStartX = null;
  let spriteReady = false;

  function fitImage(){
    const item = photos[index];
    const aspect = item.w / spriteHeight;
    const sw = stage.clientWidth;
    const sh = stage.clientHeight;
    const w = Math.min(sw, sh * aspect);
    const h = w / aspect;
    const scale = h / spriteHeight;

    image.style.width = Math.round(w) + "px";
    image.style.height = Math.round(h) + "px";
    image.style.backgroundSize =
      Math.round(spriteWidth * scale) + "px " +
      Math.round(spriteHeight * scale) + "px";
    image.style.backgroundPosition =
      Math.round(-item.x * scale) + "px 0";
  }

  function render(){
    fitImage();
    empty.style.display = "none";
    title.textContent = "";

    counter.textContent =
      String(index + 1).padStart(2,"0") + " / " +
      String(photos.length).padStart(2,"0");

    prev.disabled = photos.length < 2;
    next.disabled = photos.length < 2;

    if(spriteReady) image.classList.add("show");
  }

  function move(step){
    if(photos.length < 2)return;
    image.classList.remove("show");
    index=(index+step+photos.length)%photos.length;
    requestAnimationFrame(function(){
      render();
      requestAnimationFrame(function(){image.classList.add("show")});
    });
  }

  prev.addEventListener("click",function(){move(-1)});
  next.addEventListener("click",function(){move(1)});

  document.addEventListener("keydown",function(e){
    if(e.key==="ArrowLeft")move(-1);
    if(e.key==="ArrowRight")move(1);
  });

  stage.addEventListener("touchstart",function(e){
    touchStartX=e.changedTouches[0].clientX;
  },{passive:true});

  stage.addEventListener("touchend",function(e){
    if(touchStartX===null)return;
    const dx=e.changedTouches[0].clientX-touchStartX;
    if(Math.abs(dx)>45)move(dx>0?-1:1);
    touchStartX=null;
  },{passive:true});

  window.addEventListener("resize",fitImage);

  const spriteUrl = "photos/gallery.webp?v=21";
  const preload = new Image();
  preload.onload = function(){
    image.style.backgroundImage = 'url("' + spriteUrl + '")';
    spriteReady = true;
    render();
    requestAnimationFrame(function(){image.classList.add("show")});
  };
  preload.src = spriteUrl;
})();
</script>
</body>
</html>
