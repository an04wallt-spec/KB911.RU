  function typeText(){
    if(!copy||copy.dataset.started)return;
    copy.dataset.started="1";
    const textNode=copy.querySelector("p").firstChild;
    const full=textNode.nodeValue;
    textNode.nodeValue="";
    copy.style.visibility="visible";
    let i=0;
    const step=()=>{
      if(i>=full.length)return;
      const ch=full[i++];
      textNode.nodeValue+=ch;
      setTimeout(step,ch==="."||ch==="!"?650:55);
    };
    step();
  }

  function revealPhoto(){
    if(reduced){typeText();return}
    const rect=photo.getBoundingClientRect();
    const dpr=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.max(1,Math.round(rect.width*dpr));
    canvas.height=Math.max(1,Math.round(rect.height*dpr));
    const ctx=canvas.getContext("2d");
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle="#fff";
    ctx.fillRect(0,0,rect.width,rect.height);
    ctx.globalCompositeOperation="destination-out";

    const duration=6200;
    const started=performance.now();
    function frame(now){
      const p=Math.min(1,(now-started)/duration);
      const grains=Math.round(8+80*p);
      for(let i=0;i<grains;i++){
        const x=Math.random()*rect.width;
        const y=Math.random()*rect.height;
        const r=(1.2+Math.random()*3.8)*(0.35+p*1.8);
        ctx.beginPath();
        ctx.arc(x,y,r,0,Math.PI*2);
        ctx.fill();
      }
      if(p<1){
        requestAnimationFrame(frame);
      }else{
        canvas.style.transition="opacity 900ms ease";
        canvas.style.opacity="0";
        setTimeout(()=>{canvas.remove();typeText()},900);
      }
    }
    requestAnimationFrame(frame);
  }

  if(photo.complete)revealPhoto();
  else photo.addEventListener("load",revealPhoto,{once:true});
})();
</script>
