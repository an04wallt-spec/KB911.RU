<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PIFA — KB911</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<style>
@font-face{font-family:"Bahnschrift Local";src:local("Bahnschrift");font-style:normal;font-weight:100 900}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;color:#111}
body{font-family:"Bahnschrift Local","Bahnschrift SemiCondensed","Arial Narrow",Arial,sans-serif}
.page{width:min(92vw,720px);margin:0 auto;padding:clamp(14px,2.5vw,28px) 0 40px}
.photo-wrap{position:relative;width:100%;overflow:hidden;background:#fff}
.photo{display:block;width:100%;height:auto}
.mask{position:absolute;inset:0;pointer-events:none;background:#fff}
.copy{visibility:hidden;margin-top:clamp(16px,2.2vw,24px);font-size:clamp(17px,2.2vw,24px);line-height:1.45;letter-spacing:-.01em;overflow-wrap:anywhere}
.copy p{margin:0}
@media(max-width:560px){
  .page{width:100%;padding:0 0 28px}
  .copy{padding:0 16px;font-size:clamp(16px,4.4vw,20px);line-height:1.38}
}
@media(prefers-reduced-motion:reduce){
  .mask{display:none}
  .copy{visibility:visible}
}
</style>
</head>
<body>
<main class="page">
  <div class="photo-wrap">
    <img class="photo" id="photo" src="pifa-photo.jpg" alt="Валерий Анатольевич в мастерской">
    <canvas class="mask" id="mask" aria-hidden="true"></canvas>
  </div>

  <section class="copy" id="copy">
    <p>Меня зовут Валерий Анатольевич! Я Заслуженный плотник Республики Узбекистан. В профессии - с 90х годов прошлого века. У меня 80й уровень и 54й разряд. Я делаю любую мебель. Делаю красиво и дорого. Звоните мне на домашний телефон +998 97 721 21 63.</p>
  </section>
</main>

<script>
(()=>{
  const reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const photo=document.getElementById("photo");
  const canvas=document.getElementById("mask");
  const copy=document.getElementById("copy");

  function typeText(){
    const p=copy.querySelector("p");
    const full=p.textContent;
    p.textContent="";
    copy.style.visibility="visible";
    let i=0;
    function step(){
      if(i>=full.length)return;
      const ch=full[i++];
      p.textContent+=ch;
      setTimeout(step,(ch==="."||ch==="!")?650:55);
    }
    step();
  }

  function revealPhoto(){
    if(reduced){typeText();return}
    const rect=photo.getBoundingClientRect();
    const dpr=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.round(rect.width*dpr);
    canvas.height=Math.round(rect.height*dpr);
    canvas.style.width=rect.width+"px";
    canvas.style.height=rect.height+"px";

    const ctx=canvas.getContext("2d");
    ctx.scale(dpr,dpr);
    ctx.fillStyle="#fff";
    ctx.fillRect(0,0,rect.width,rect.height);
    ctx.globalCompositeOperation="destination-out";

    const started=performance.now();
    const duration=6000;

    function frame(now){
      const p=Math.min(1,(now-started)/duration);
      const count=Math.floor(18+120*p);
      for(let i=0;i<count;i++){
        const x=Math.random()*rect.width;
        const y=Math.random()*rect.height;
        const r=(1+Math.random()*3)*(0.4+p*2.2);
        ctx.beginPath();
        ctx.arc(x,y,r,0,Math.PI*2);
        ctx.fill();
      }
      if(p<1){
        requestAnimationFrame(frame);
      }else{
        canvas.style.transition="opacity .8s ease";
        canvas.style.opacity="0";
        setTimeout(typeText,850);
      }
    }
    requestAnimationFrame(frame);
  }

  if(photo.complete)revealPhoto();
  else photo.addEventListener("load",revealPhoto,{once:true});
})();
</script>
</body>
</html>
