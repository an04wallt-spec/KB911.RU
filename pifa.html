<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PIFA — KB911</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<style>
@font-face{
  font-family:"Bahnschrift Local";
  src:local("Bahnschrift");
  font-style:normal;
  font-weight:100 900;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:#fff;
  color:#111;
}

body{
  font-family:"Bahnschrift Local","Bahnschrift SemiCondensed","Arial Narrow",Arial,sans-serif;
}

.page{
  width:min(92vw,960px);
  margin:0 auto;
  padding:clamp(14px,2.5vw,28px) 0 40px;
}

.photo-wrap{
  position:relative;
  width:100%;
  overflow:hidden;
  background:#fff;
}

.photo{
  display:block;
  width:100%;
  height:auto;
  transform:scale(1);
  transform-origin:center center;
  will-change:transform;
}

.photo.alive{
  animation:slowZoom 16s ease-in-out infinite alternate;
}

@keyframes slowZoom{
  from{transform:scale(1)}
  to{transform:scale(1.035)}
}

.fog{
  position:absolute;
  inset:0;
  background:#fff;
  opacity:1;
  pointer-events:none;
  transition:opacity 6s ease;
  z-index:3;
}

.fog.hide{
  opacity:0;
}

.dust-layer{
  position:absolute;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  opacity:0;
  transition:opacity 2.5s ease;
  z-index:2;
}

.dust-layer.show{
  opacity:1;
}

.dust{
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,.72);
  box-shadow:0 0 7px rgba(255,255,255,.42);
  filter:blur(.35px);
  animation-name:dustFloat;
  animation-timing-function:ease-in-out;
  animation-iteration-count:infinite;
  animation-direction:alternate;
}

@keyframes dustFloat{
  from{
    transform:translate3d(0,0,0) scale(.8);
    opacity:.18;
  }
  to{
    transform:translate3d(var(--dx),var(--dy),0) scale(1.15);
    opacity:.58;
  }
}

.copy{
  margin-top:clamp(18px,2.5vw,28px);
  text-align:center;
  font-size:clamp(17px,2vw,24px);
  line-height:1.5;
  letter-spacing:-.01em;
}

.line{
  min-height:1.5em;
  margin:0 0 .35em;
}

@media(max-width:560px){
  .page{
    width:100%;
    padding:0 0 18px;
  }

  .copy{
    margin-top:10px;
    padding:0 10px;
    font-size:clamp(12px,3.15vw,14px);
    line-height:1.22;
    letter-spacing:-.03em;
  }

  .line{
    min-height:1.22em;
    margin:0 0 .08em;
  }
}

@media(prefers-reduced-motion:reduce){
  .fog{display:none}
  .dust-layer{display:none}
  .photo.alive{animation:none}
}
</style>
</head>
<body>
<main class="page">
  <div class="photo-wrap">
    <img class="photo" id="photo" src="pifa-photo.jpg?v=2" alt="Валерий Анатольевич в мастерской">
    <div class="dust-layer" id="dustLayer" aria-hidden="true"></div>
    <div class="fog" id="fog" aria-hidden="true"></div>
  </div>

  <section class="copy" id="copy" aria-label="Описание">
    <p class="line" data-text="Меня зовут Валерий Анатольевич!"></p>
    <p class="line" data-text="Я Заслуженный плотник Республики Узбекистан."></p>
    <p class="line" data-text="В профессии - с 90х годов прошлого века."></p>
    <p class="line" data-text="У меня 80й уровень и 54й разряд."></p>
    <p class="line" data-text="Я делаю любую мебель."></p>
    <p class="line" data-text="Делаю красиво и дорого."></p>
    <p class="line" data-text="Звоните мне на домашний телефон +998 97 721 21 63."></p>
  </section>
</main>

<script>
(()=>{
  const photo=document.getElementById("photo");
  const fog=document.getElementById("fog");
  const dustLayer=document.getElementById("dustLayer");
  const lines=[...document.querySelectorAll(".line")];
  const reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let typingStarted=false;

  const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));

  function createDust(){
    const count=window.innerWidth<=560 ? 16 : 24;
    dustLayer.innerHTML="";

    for(let i=0;i<count;i++){
      const dot=document.createElement("span");
      dot.className="dust";

      const size=(Math.random()*4+2).toFixed(2);
      const left=(Math.random()*100).toFixed(2);
      const top=(Math.random()*72).toFixed(2);
      const dx=(Math.random()*36-18).toFixed(2)+"px";
      const dy=(Math.random()*42+16).toFixed(2)+"px";
      const delay=(Math.random()*5).toFixed(2)+"s";
      const duration=(Math.random()*7+9).toFixed(2)+"s";

      dot.style.width=size+"px";
      dot.style.height=size+"px";
      dot.style.left=left+"%";
      dot.style.top=top+"%";
      dot.style.setProperty("--dx",dx);
      dot.style.setProperty("--dy",dy);
      dot.style.animationDelay=delay;
      dot.style.animationDuration=duration;

      dustLayer.appendChild(dot);
    }
  }

  async function typeLines(){
    if(typingStarted)return;
    typingStarted=true;

    for(const line of lines){
      const text=line.dataset.text;
      for(const ch of text){
        line.textContent+=ch;
        await sleep(ch==="."||ch==="!"?450:55);
      }
      await sleep(220);
    }
  }

  function startReveal(){
    createDust();

    if(reduced){
      dustLayer.classList.add("show");
      photo.classList.add("alive");
      typeLines();
      return;
    }

    requestAnimationFrame(()=>{
      fog.classList.add("hide");
      dustLayer.classList.add("show");
      photo.classList.add("alive");
    });

    window.setTimeout(typeLines,6100);
  }

  if(photo.complete)startReveal();
  else photo.addEventListener("load",startReveal,{once:true});

  window.addEventListener("resize",()=>{
    createDust();
  });
})();
</script>
</body>
</html>
