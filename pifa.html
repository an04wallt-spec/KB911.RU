<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PIFA — KB911</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<style>
@font-face{font-family:"Bahnschrift Local";src:local("Bahnschrift");font-style:normal;font-weight:100 900}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;color:#111}
body{font-family:"Bahnschrift Local","Bahnschrift SemiCondensed","Arial Narrow",Arial,sans-serif}
.page{width:min(92vw,960px);margin:0 auto;padding:clamp(14px,2.5vw,28px) 0 40px}
.photo{
  display:block;
  width:100%;
  height:auto;
  opacity:0;
  filter:blur(28px) brightness(2.25);
  transform:scale(1.015);
  transition:
    opacity 6s ease,
    filter 6s ease,
    transform 6s ease;
}
.photo.show{
  opacity:1;
  filter:blur(0) brightness(1);
  transform:scale(1);
}
.copy{
  margin-top:clamp(18px,2.5vw,28px);
  text-align:center;
  font-size:clamp(17px,2vw,24px);
  line-height:1.5;
  letter-spacing:-.01em;
}
.line{
  min-height:1.5em;
  margin:0 0 .35em;
}
@media(max-width:560px){
  .page{width:100%;padding:0 0 28px}
  .copy{padding:0 16px;font-size:clamp(16px,4.4vw,20px);line-height:1.42}
}
@media(prefers-reduced-motion:reduce){
  .photo{opacity:1;filter:none;transform:none;transition:none}
}
</style>
</head>
<body>
<main class="page">
  <img class="photo" id="photo" src="pifa-photo.jpg" alt="Валерий Анатольевич в мастерской">

  <section class="copy" id="copy" aria-label="Описание">
    <p class="line" data-text="Меня зовут Валерий Анатольевич!"></p>
    <p class="line" data-text="Я Заслуженный плотник Республики Узбекистан."></p>
    <p class="line" data-text="В профессии - с 90х годов прошлого века."></p>
    <p class="line" data-text="У меня 80й уровень и 54й разряд."></p>
    <p class="line" data-text="Я делаю любую мебель."></p>
    <p class="line" data-text="Делаю красиво и дорого."></p>
    <p class="line" data-text="Звоните мне на домашний телефон +998 97 721 21 63."></p>
  </section>
</main>

<script>
(()=>{
  const photo=document.getElementById("photo");
  const lines=[...document.querySelectorAll(".line")];
  const reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let typingStarted=false;

  const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));

  async function typeLines(){
    if(typingStarted)return;
    typingStarted=true;
    for(const line of lines){
      const text=line.dataset.text;
      for(const ch of text){
        line.textContent+=ch;
        await sleep(ch==="."||ch==="!"?450:55);
      }
      await sleep(220);
    }
  }

  function startReveal(){
    requestAnimationFrame(()=>photo.classList.add("show"));
    if(reduced){
      typeLines();
      return;
    }
    window.setTimeout(typeLines,6100);
  }

  if(photo.complete)startReveal();
  else photo.addEventListener("load",startReveal,{once:true});
})();
</script>
</body>
</html>
